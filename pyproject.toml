[project]
name = "comfyui_xiawan_workflow_plugin"
description = "Xiawan workflow custom nodes for ComfyUI"
version = "1.4.1"
license = { text = "MIT" }
requires-python = ">=3.10,<3.13"
dependencies = [
    "numpy>=1.24,<3",
    "Pillow>=9,<13",
]

[project.optional-dependencies]
mira = [
    "onnxruntime>=1.16,<2",
    "piexif>=1.1,<2",
    "requests>=2.28,<3",
]
controlnet-aux = [
    "opencv-python>=4.8,<5",
    "scipy>=1.10,<2",
    "scikit-image>=0.21,<1",
    "mediapipe>=0.10,<1",
    "onnxruntime-gpu>=1.16,<2",
]
impact = [
    "transformers>=4.38,<5",
    "segment-anything>=1,<2",
    "opencv-python-headless>=4.8,<5",
    "scikit-image>=0.21,<1",
]

[tool.comfy]
PublisherId = "xiawan"
DisplayName = "Xiawan Workflow Plugin"

[tool.xiawan]
workflow_version = "R-1.4.1"
torch_cuda_policy = "managed by the host ComfyUI installation"
